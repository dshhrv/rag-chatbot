<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Чат-бот (Попаткус)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-titles">
                <h1>Попаткус</h1>
                <p>Помощник по правилам и документам НИУ ВШЭ</p>
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <div class="message bot-message">
                <div class="message-content">
                    Привет! Я Попаткус, твой помощник по документам Вышки. Какой у тебя вопрос?
                </div>
            </div>
        </main>

        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Введите ваш вопрос..." autocomplete="off" />
            <button id="send-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
